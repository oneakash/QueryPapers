[project]
name = "hitl-rag-system"
version = "0.1.0"
description = "Production-grade Stateful HITL RAG with LangGraph, FastAPI, and Qdrant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "langchain-core>=0.3.15",
    "langchain-text-splitters>=0.3.2",
    "qdrant-client>=1.12.0",
    "pymupdf>=1.24.13",
    "python-multipart>=0.0.17",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.2",
    "black>=24.10.0",
    "isort>=5.13.2",
    "pycodestyle>=2.12.1",
    "mypy>=1.13.0",
    "bandit>=1.7.10",
    "radon>=6.0.1",
    "vulture>=2.13",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
ignore_errors = true
follow_untyped_imports = true
